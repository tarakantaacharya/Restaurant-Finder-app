<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant Finder{% endblock %}</title>
    
    <!-- Common CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/color_themes.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Page-specific CSS -->
    {% block styles %}{% endblock %}
    
    <style>
        /* Base styles that apply to all pages */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    {% block content %}{% endblock %}
    
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</button>
    
    <!-- Common JavaScript -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    
    <!-- Page-specific JavaScript -->
    {% block scripts %}{% endblock %}
</body>
</html>
