<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Restaurant Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/color_themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Override login.css styles with theme variables */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .container {
            background-color: var(--container-bg);
        }
        .form-container {
            background-color: var(--container-bg);
            box-shadow: var(--shadow);
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
        }
        .form-content h2 {
            color: var(--heading-color);
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group label {
            color: var(--text-color);
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .submit-btn {
            background-color: var(--primary-color);
            color: var(--button-text);
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }
        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
        .back-to-login {
            text-align: center;
            margin-top: 1rem;
        }
        .back-to-login a {
            color: var(--link-color);
            text-decoration: none;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .logo span {
            font-size: 2rem;
        }
        .logo h1 {
            font-size: 1.5rem;
            color: var(--heading-color);
            margin: 0;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="logo">
                <span>🍽️</span>
                <h1>Restaurant Finder</h1>
            </div>
            
            <div class="form-content">
                <h2>Forgot Password</h2>
                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="success-message">{{ success }}</div>
                {% endif %}
                
                <form action="/forgot-password" method="post">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Send Reset Link</button>
                    
                    <div class="back-to-login">
                        <a href="{{ url_for('login_page') }}">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Include Theme Toggle -->
    {% include 'theme_toggle.html' %}
</body>
</html>
