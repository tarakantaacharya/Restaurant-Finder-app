<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Theme Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/color_themes.css') }}">
    <style>
        .dev-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: var(--container-bg);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        
        .login-form {
            max-width: 400px;
            margin: 0 auto 30px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        
        .login-form button {
            width: 100%;
            padding: 10px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .login-form button:hover {
            background-color: var(--button-hover);
        }
        
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .color-option {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .color-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .color-option.active {
            border: 3px solid white;
            box-shadow: 0 0 0 3px #333;
        }
        
        .color-option.active::after {
            content: "✓";
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 18px;
        }
        
        .orange { background-color: #e7460b; }
        .yellow { background-color: #ffc107; }
        .purple { background-color: #6f42c1; }
        .red { background-color: #dc3545; }
        .blue { background-color: #0d6efd; }
        .violet { background-color: #8a2be2; }
        .pink { background-color: #d63384; }
        
        .back-link {
            margin-top: 30px;
        }
        
        .back-link a {
            color: var(--link-color);
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .save-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .save-success {
            background-color: var(--success-bg);
            color: var(--success-text);
        }
        
        .error-message {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .theme-panel {
            display: none;
        }
    </style>
</head>
<body>
    <div class="dev-container">
        <h1>Developer Theme Settings</h1>
        
        <div id="login-panel" class="login-form">
            <div id="error-message" class="error-message"></div>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="login-btn">Login</button>
        </div>
        
        <div id="theme-panel" class="theme-panel">
            <p>Select a color theme for the website. This change will affect all users.</p>
            
            <div class="color-options">
                <div class="color-option orange" data-theme="orange">Orange</div>
                <div class="color-option yellow" data-theme="yellow">Yellow</div>
                <div class="color-option purple" data-theme="purple">Purple</div>
                <div class="color-option red" data-theme="red">Red</div>
                <div class="color-option blue" data-theme="blue">Blue</div>
                <div class="color-option violet" data-theme="violet">Violet</div>
                <div class="color-option pink" data-theme="pink">Pink</div>
            </div>
            
            <div id="save-message" class="save-message save-success">
                Theme saved successfully!
            </div>
            
            <!-- Back link removed as requested -->
        </div>
    </div>
    
    {% include 'theme_toggle.html' %}
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginPanel = document.getElementById('login-panel');
            const themePanel = document.getElementById('theme-panel');
            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            
            // Check if already authenticated
            const isAuthenticated = localStorage.getItem('devAuthenticated') === 'true';
            if (isAuthenticated) {
                loginPanel.style.display = 'none';
                themePanel.style.display = 'block';
                loadThemeOptions();
            }
            
            // Login button click handler
            loginBtn.addEventListener('click', function() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Simple hardcoded authentication
                if (username === 'admin' && password === '123') {
                    localStorage.setItem('devAuthenticated', 'true');
                    loginPanel.style.display = 'none';
                    themePanel.style.display = 'block';
                    loadThemeOptions();
                } else {
                    errorMessage.textContent = 'Invalid username or password';
                    errorMessage.style.display = 'block';
                }
            });
            
            // Load theme options
            function loadThemeOptions() {
                // Get current color theme from localStorage or use default
                fetch('/api/current_theme')
                    .then(response => response.json())
                    .then(data => {
                        const currentColorTheme = data.theme || 'orange';
                        
                        // Apply the color theme
                        document.documentElement.setAttribute('data-color-theme', currentColorTheme);
                        
                        // Mark the active color option
                        const activeOption = document.querySelector(`.color-option[data-theme="${currentColorTheme}"]`);
                        if (activeOption) {
                            activeOption.classList.add('active');
                        }
                        
                        // Add event listeners to color options
                        const colorOptions = document.querySelectorAll('.color-option');
                        colorOptions.forEach(option => {
                            option.addEventListener('click', function() {
                                const selectedTheme = this.getAttribute('data-theme');
                                
                                // Remove active class from all options
                                colorOptions.forEach(opt => opt.classList.remove('active'));
                                
                                // Add active class to selected option
                                this.classList.add('active');
                                
                                // Apply the color theme
                                document.documentElement.setAttribute('data-color-theme', selectedTheme);
                                
                                // We don't need to save to localStorage anymore as we're using server-side storage
                                // localStorage.setItem('colorTheme', selectedTheme);
                                
                                // Save to server
                                saveThemePreference(selectedTheme);
                            });
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching theme:', error);
                    });
            }
            
            // Function to save theme preference to server
            function saveThemePreference(theme) {
                fetch('/dev/save_theme', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ theme: theme }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const saveMessage = document.getElementById('save-message');
                        saveMessage.style.display = 'block';
                        
                        // Hide message after 3 seconds
                        setTimeout(() => {
                            saveMessage.style.display = 'none';
                        }, 3000);
                        
                        // Force reload the page to ensure theme is applied everywhere
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error saving theme:', error);
                });
            }
        });
    </script>
</body>
</html>
