name: Deploy to Cloud Run from Source

on:
  push:
    branches:
      - main  # Set this to your default branch

env:
  PROJECT_ID: your-gcp-project-id  # TODO: update Google Cloud project ID
  SERVICE_NAME: restaurant-finder   # TODO: update Cloud Run service name
  REGION: us-central1              # TODO: update Cloud Run service region

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # NOTE: Alternative option - authentication via credentials json
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'  # TODO: create service account key and store in GitHub secrets

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          # Pass environment variables from GitHub secrets to Cloud Run
          env_vars: |
            DATABASE_HOST_LOCAL=${{ secrets.DATABASE_HOST_LOCAL }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GEO_API_KEY=${{ secrets.GEO_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL_NAME=${{ secrets.GEMINI_MODEL_NAME }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          
      # If required, use the Cloud Run URL output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}